name: Unit Tests & Coverage

on:
  push:
    branches: [main]
    paths:
      - "ionerdss/**"
      - "tests/**"
      - ".github/workflows/unittest.yml"
  pull_request:
    branches: [main]
    paths:
      - "ionerdss/**"
      - "tests/**"
      - ".github/workflows/unittest.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: ${{ matrix.os }} • Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4                                    # latest major version :contentReference[oaicite:0]{index=0}
      - name: Set up Python
        uses: actions/setup-python@v5                                # latest major version :contentReference[oaicite:1]{index=1}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache compiled pip wheels
        uses: actions/cache@v4                                       # recommended upgrade :contentReference[oaicite:2]{index=2}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}
            ${{ runner.os }}-pip-

      - uses: tlambert03/setup-qt-libs@v1                            # current major version :contentReference[oaicite:3]{index=3}

      - name: Install dependencies (including test extras)
        run: pip install -e .[tests]

      - name: Configure headless Qt
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest tests \
            --cov=ionerdss --cov-branch \
            --cov-report=xml \
            --junitxml=report.xml

      - name: Summarise failing tests
        if: always()
        uses: pmeier/pytest-results-action@v0.7.2                    # bumped to latest v0.7.2 :contentReference[oaicite:4]{index=4}
        with:
          path: report.xml
          summary: true
          display-options: fEX
          title: "Test Results"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5                             # latest major version :contentReference[oaicite:5]{index=5}
        with:
          use_oidc: true
          fail_ci_if_error: true

