# .github/workflows/sync-compact.yml
name: Sync to Compact Branch

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**/*.ipynb'
      - '.github/workflows/sync-compact.yml'

permissions:
  contents: write

jobs:
  sync-compact:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout or create compact branch
        run: |
          if git show-ref --verify --quiet refs/heads/compact; then
            git checkout compact
            git reset --hard main
          else
            git checkout -b compact main
          fi

      - name: Remove unnecessary files
        run: |
          find . -name "*.ipynb" -type f -delete
          rm -rf docs data || true

      - name: Show removed files
        run: git ls-files --deleted

      - name: Commit & push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync: remove notebooks, docs, and data"
          fi
          git push --force origin compact
